[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neuropixels-explorer"
version = "4.3.0b1"
description = "Local-first Neuropixels review UI and optional indexed data service"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "h5py>=3.8"]

[project.optional-dependencies]
behavior = ["scikit-learn>=1.5,<2"]
allen = ["h5py>=3.8", "pandas>=2", "matplotlib>=3.7", "requests>=2.31", "av>=14"]

[project.scripts]
neuropixels-explorer = "neuropixels_explorer.cli:main"

[tool.setuptools]
package-dir = {"" = "server"}

[tool.setuptools.packages.find]
where = ["server"]

[tool.setuptools.package-data]
neuropixels_explorer = ["py.typed", "schema/*.sql"]

[tool.unittest]
start-directory = "tests/python"
